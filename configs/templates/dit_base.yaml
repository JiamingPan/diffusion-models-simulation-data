# Unconditional CAMELS LH DiT template matched to the U128 UNet.
#
# diffusers.DiTTransformer2DModel uses adaLN conditioning and requires
# class_labels in forward(). For unconditional training we use one null class:
# data.constant_label: 0 creates label 0 for every 2D HI slice, and sampling
# should pass --class-label 0. This keeps train/sample conditioning consistent
# without adding cosmology conditioning. TODO: replace the null class with a
# continuous theta -> adaLN embedding for conditional cosmology experiments.
#
# Matched target: U128 UNet = 140.54M params; this DiT = 138.29M params (-1.60%).
# Edit data.img_path and io.output_dir before running.

global:
  device: cuda
  dtype: float32

io:
  output_dir: /path/to/output/dit_base_lh_checkpoints

data:
  img_path: /path/to/CAMELS/CMD/3d_grids/IllustrisTNG/Grids_HI_IllustrisTNG_LH_128_z=0.0.npy
  img_read_fn: npy_read_fn
  label_path:
  label_read_fn: npy_read_fn
  constant_label: 0
  log: true
  minmax: false
  normalization: centered_maxabs
  norm_kwargs:
    center: mean
  two_dim: true
  zthin: 4
  n_samples: null
  keep_on_cpu: false
  seed: null

augmentations:
  RandomRoll:
    dims: [-1, -2]
  RandomFlip:
    dims: [-1, -2]
    p: 0.5

model:
  class: DiTTransformer2DModel
  kwargs:
    sample_size: 128
    patch_size: 8
    in_channels: 1
    out_channels: 1
    num_layers: 12
    num_attention_heads: 12
    attention_head_dim: 64
    num_embeds_ada_norm: 1
    norm_num_groups: 32

noise_scheduler:
  class: DDPMScheduler
  kwargs:
    num_train_timesteps: 1000

optimizer:
  class: AdamW
  kwargs:
    lr: 1.0e-4
    weight_decay: 1.0e-2

lr_scheduler:
  class: CosineAnnealingLR
  kwargs:
    # Adjust for dataset size: ceil(N_train_2d / effective_batch_size) * num_epochs.
    T_max: 2400000

train:
  num_epochs: 500
  batch_size: 2
  shuffle: true
  checkpoint_every_n_epochs: 10
  mixed_precision: fp16
  gradient_accumulation_steps: 4
  dataloader_num_workers: 0
  max_grad_norm: 1.0
  verbose: true
  force_cpu: false
  pin_memory: false
