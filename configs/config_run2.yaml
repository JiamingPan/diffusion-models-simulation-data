global:
  device: cuda
  dtype: float32

io:
  output_dir: /home/jiamingp/Diffusion_model/saved_runs/run2_checkpoints

data:
  img_path: /scratch/huterer_root/huterer0/CAMELS/CMD/3d_grids/IllustrisTNG/Grids_HI_IllustrisTNG_CV_128_z=0.0.npy
  img_read_fn: npy_read_fn
  label_path:
  label_read_fn: npy_read_fn
  log: true
  minmax: true
  two_dim: true
  zthin: 4
  n_samples: null
  keep_on_cpu: false
  seed: null

augmentations:
  RandomRoll:
    dims: [-1, -2]
  RandomFlip:
    dims: [-1, -2]
    p: 0.5

model:
  class: UNet2DModel
  kwargs:
    sample_size: 128
    in_channels: 1
    out_channels: 1
    layers_per_block: 2
    block_out_channels: [32, 64]
    down_block_types:
      - DownBlock2D
      - AttnDownBlock2D
    up_block_types:
      - AttnUpBlock2D
      - UpBlock2D
    norm_num_groups: 32

noise_scheduler:
  class: DDPMScheduler
  kwargs:
    num_train_timesteps: 1000

optimizer:
  class: AdamW
  kwargs:
    lr: 1.0e-3
    weight_decay: 1.0e-2

lr_scheduler:
  class: CosineAnnealingLR
  kwargs:
    T_max: 2160

train:
  num_epochs: 40
  batch_size: 16
  shuffle: true
  checkpoint_every_n_epochs: 5
  mixed_precision: fp16
  gradient_accumulation_steps: 1
  dataloader_num_workers: 0
  max_grad_norm: 1.0
  verbose: true
  force_cpu: false
  pin_memory: false