global:
  device: cuda
  dtype: float32

io:
  output_dir: /scratch/huterer_root/huterer0/jiamingp/saved_runs/run9_checkpoints

data:
  img_path: /scratch/huterer_root/huterer0/CAMELS/CMD/3d_grids/IllustrisTNG/Grids_HI_IllustrisTNG_CV_128_z=0.0.npy
  img_read_fn: npy_read_fn
  label_path:
  label_read_fn: npy_read_fn
  log: true
  minmax: false
  normalization: centered_maxabs
  norm_kwargs:
    center: mean
  two_dim: true
  zthin: 4
  n_samples: null
  keep_on_cpu: false
  seed: null

# Same centered data and augmentation as run8. This run only changes the LR scheduler.
augmentations:
  RandomRoll:
    dims: [-1, -2]
  RandomFlip:
    dims: [-1, -2]
    p: 0.5

model:
  class: UNet2DModel
  kwargs:
    sample_size: 128
    in_channels: 1
    out_channels: 1
    layers_per_block: 2
    block_out_channels: [64, 128, 256, 256]
    down_block_types:
      - DownBlock2D
      - DownBlock2D
      - AttnDownBlock2D
      - AttnDownBlock2D
    up_block_types:
      - AttnUpBlock2D
      - AttnUpBlock2D
      - UpBlock2D
      - UpBlock2D
    norm_num_groups: 32

noise_scheduler:
  class: DDPMScheduler
  kwargs:
    num_train_timesteps: 1000

optimizer:
  class: AdamW
  kwargs:
    lr: 1.0e-4
    weight_decay: 1.0e-2

lr_scheduler:
  class: StepLR
  kwargs:
    # Scheduler is stepped once per mini-batch in optim.train().
    # With 864 slices and batch_size=8, 500 steps is about 4.6 epochs.
    step_size: 500
    gamma: 0.33

train:
  num_epochs: 120
  batch_size: 8
  shuffle: true
  checkpoint_every_n_epochs: 20
  mixed_precision: fp16
  gradient_accumulation_steps: 1
  dataloader_num_workers: 0
  max_grad_norm: 1.0
  verbose: true
  force_cpu: false
  pin_memory: false
