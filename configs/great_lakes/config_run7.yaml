global:
  device: cuda
  dtype: float32

io:
  output_dir: /scratch/huterer_root/huterer0/jiamingp/saved_runs/run7_checkpoints

data:
  img_path: /scratch/huterer_root/huterer0/CAMELS/CMD/3d_grids/IllustrisTNG/Grids_HI_IllustrisTNG_CV_128_z=0.0.npy
  img_read_fn: npy_read_fn
  label_path:
  label_read_fn: npy_read_fn
  log: true
  minmax: false
  normalization: quantile_minmax
  norm_kwargs:
    q_low: 0.001
    q_high: 99.99
    max_quantile_samples: 2000000
  two_dim: true
  zthin: 4
  n_samples: null
  keep_on_cpu: false
  seed: null

# Same as run6 except for normalization.
augmentations:
  RandomRoll:
    dims: [-1, -2]
  RandomFlip:
    dims: [-1, -2]
    p: 0.5

model:
  class: UNet2DModel
  kwargs:
    sample_size: 128
    in_channels: 1
    out_channels: 1
    layers_per_block: 2
    block_out_channels: [64, 128, 256, 256]
    down_block_types:
      - DownBlock2D
      - DownBlock2D
      - AttnDownBlock2D
      - AttnDownBlock2D
    up_block_types:
      - AttnUpBlock2D
      - AttnUpBlock2D
      - UpBlock2D
      - UpBlock2D
    norm_num_groups: 32

noise_scheduler:
  class: DDPMScheduler
  kwargs:
    num_train_timesteps: 1000

optimizer:
  class: AdamW
  kwargs:
    lr: 1.0e-4
    weight_decay: 1.0e-2

lr_scheduler:
  class: CosineAnnealingLR
  kwargs:
    # T_max = ceil(864 / 8) * 120 = 12960 for the CV data with zthin=4.
    T_max: 12960

train:
  num_epochs: 120
  batch_size: 8
  shuffle: true
  checkpoint_every_n_epochs: 20
  mixed_precision: fp16
  gradient_accumulation_steps: 1
  dataloader_num_workers: 0
  max_grad_norm: 1.0
  verbose: true
  force_cpu: false
  pin_memory: false
